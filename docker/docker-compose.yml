version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: quizhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: QuizHubDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quizhub_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: quizhub_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - quizhub_network

volumes:
  postgres_data:

networks:
  quizhub_network:
    driver: bridge
